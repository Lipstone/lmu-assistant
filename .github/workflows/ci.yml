name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  build-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[overlay,build]"
      - run: python packaging/build_exe.py
      - name: Vérifie que l'exécutable démarre et sert la page
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\LMU-Assistant.exe -ArgumentList "--no-overlay","--no-window","--source","mock","--port","8799" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 1
            try {
              $info = Invoke-RestMethod http://127.0.0.1:8799/api/info
              $page = Invoke-WebRequest http://127.0.0.1:8799/ -UseBasicParsing
              if ($info.source -eq "mock" -and $page.Content -match "LMU Assistant") { $ok = $true; break }
            } catch {}
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "L'exécutable n'a pas répondu sur le port 8799" }
          Write-Output "OK : $($info | ConvertTo-Json -Compress)"
      - name: Vérifie que l'interface et l'overlay (Qt) s'ouvrent, sans console
        shell: pwsh
        run: |
          # Exe sans console : les messages sont dans data\lmu-assistant.log, à côté de l'exe.
          $p = Start-Process -FilePath dist\LMU-Assistant.exe -ArgumentList "--source","mock","--port","8798","--quit-after","25" -PassThru -Wait
          $out = Get-Content dist\data\lmu-assistant.log -Raw
          Write-Output $out
          if ($p.ExitCode -ne 0 -or $out -notmatch "widgets \(Qt\)") { throw "L'overlay ne s'est pas ouvert" }
          if ($out -notmatch "\[interface\]") { throw "L'interface ingénieur ne s'est pas ouverte" }
      - uses: actions/upload-artifact@v4
        with:
          name: LMU-Assistant-windows
          path: dist/LMU-Assistant.exe
      - name: Construit l'installateur (Inno Setup)
        shell: pwsh
        run: |
          python packaging/build_exe.py --onedir
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $version = python -c "import lmu_assistant; print(lmu_assistant.__version__)"
          & $iscc "/DAppVersion=$version" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup a échoué" }
      - name: Vérifie l'installation silencieuse et le lancement de l'appli installée
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\LMU-Assistant-Setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Installation échouée ($($p.ExitCode))" }
          $app = "$env:LOCALAPPDATA\Programs\LMU Assistant"
          if (-not (Test-Path "$app\LMU-Assistant.exe")) { throw "Exe absent de $app" }
          $p = Start-Process -FilePath "$app\LMU-Assistant.exe" -ArgumentList "--source","mock","--port","8797","--quit-after","25" -PassThru -Wait
          $out = Get-Content "$app\data\lmu-assistant.log" -Raw
          Write-Output $out
          if ($p.ExitCode -ne 0 -or $out -notmatch "widgets \(Qt\)" -or $out -notmatch "\[interface\]") { throw "L'appli installée ne s'est pas ouverte" }
      - uses: actions/upload-artifact@v4
        with:
          name: LMU-Assistant-installateur
          path: dist/LMU-Assistant-Setup.exe
