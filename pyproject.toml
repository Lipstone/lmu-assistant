[project]
name = "lmu-assistant"
version = "0.1.0"
description = "Assistant ingénieur augmenté pour Le Mans Ultimate : overlay et page web locale"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "pydantic>=2", "uvicorn[standard]>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["backend"]
