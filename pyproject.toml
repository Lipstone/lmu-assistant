[project]
name = "lmu-assistant"
version = "0.1.0"
description = "Assistant ingénieur augmenté pour Le Mans Ultimate : overlay et page web locale"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "pydantic>=2", "uvicorn[standard]>=0.29", "qrcode>=7.4"]

[project.scripts]
lmu-assistant = "lmu_assistant.launcher:main"

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
overlay = ["PySide6>=6.6", "keyboard>=0.13; sys_platform == 'win32'"]
build = ["pyinstaller>=6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["backend"]
